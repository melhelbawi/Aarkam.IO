<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img" aria-label="Aarkam Sovereign Storage Mark">
  <!-- Minimalist Pure Circular Vault: 2 High-Contrast Dark Tones -->
  <!-- Deep KSA Sovereign Green: #004D25 -->
  <!-- Deep Enterprise Midnight Navy: #0E1E38 -->

  <!-- Outer Protective Storage Ring (Midnight Navy) -->
  <circle cx="50" cy="50" r="42" 
          stroke="#0E1E38" 
          stroke-width="5.5" 
          stroke-dasharray="190 75" 
          stroke-linecap="round" 
          fill="none" />

  <!-- Intermediate Sovereign Vault Ring (Deep KSA Green) -->
  <circle cx="50" cy="50" r="28" 
          stroke="#004D25" 
          stroke-width="5" 
          stroke-dasharray="120 56" 
          stroke-linecap="round" 
          transform="rotate(180 50 50)" 
          fill="none" />

  <!-- Inner Data Perimeter Ring (Midnight Navy) -->
  <circle cx="50" cy="50" r="16" 
          stroke="#0E1E38" 
          stroke-width="4" 
          stroke-dasharray="68 33" 
          stroke-linecap="round" 
          fill="none" />

  <!-- Central Sovereign Cryptographic Core (Deep KSA Green) -->
  <circle cx="50" cy="50" r="7" fill="#004D25" />
</svg>
