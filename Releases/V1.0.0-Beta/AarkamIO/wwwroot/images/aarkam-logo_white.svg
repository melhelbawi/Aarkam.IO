<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img" aria-label="Aarkam Sovereign Storage Mark (White)">
  <!-- Outer Protective Storage Ring (White) -->
  <circle cx="50" cy="50" r="42" 
          stroke="#FFFFFF" 
          stroke-width="5.5" 
          stroke-dasharray="190 75" 
          stroke-linecap="round" 
          fill="none" />

  <!-- Intermediate Sovereign Vault Ring (Sovereign Emerald) -->
  <circle cx="50" cy="50" r="28" 
          stroke="#10B981" 
          stroke-width="5" 
          stroke-dasharray="120 56" 
          stroke-linecap="round" 
          transform="rotate(180 50 50)" 
          fill="none" />

  <!-- Inner Data Perimeter Ring (White) -->
  <circle cx="50" cy="50" r="16" 
          stroke="#FFFFFF" 
          stroke-width="4" 
          stroke-dasharray="68 33" 
          stroke-linecap="round" 
          fill="none" />

  <!-- Central Sovereign Cryptographic Core (Sovereign Emerald) -->
  <circle cx="50" cy="50" r="7" fill="#10B981" />
</svg>
